name: 2) Render & send briefing

# 한국시간 월~토 08:25 시작 — Claude 분석(analysis.json) 대기 → 카드 렌더 → 08:50 텔레그램 전송
#   화~토: 전일 종가 브리핑 / 월: 주간 프리뷰
on:
  schedule:
    - cron: "25 23 * * 0-5"     # UTC 일~금 23:25 = KST 월~토 08:25
  workflow_dispatch:
    inputs:
      mode:
        description: "now = 기다리지 않고 바로 전송 / mock = 샘플 데이터로 수신 테스트"
        type: choice
        options: [now, mock]
        default: now
      day:
        description: "data 폴더 날짜 (비우면 오늘 KST)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: deliver
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TZ: Asia/Seoul
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run
        run: |
          git config user.name  "stock-brief-bot"
          git config user.email "stock-brief-bot@users.noreply.github.com"
          set -o pipefail
          mkdir -p output
          case "${{ github.event.inputs.mode }}" in
            now)  python main.py deliver --no-wait --force ${{ github.event.inputs.day && format('--day {0}', github.event.inputs.day) || '' }} 2>&1 | tee output/run.log ;;
            mock) python main.py mock --send 2>&1 | tee output/run.log ;;
            *)    python main.py deliver 2>&1 | tee output/run.log ;;
          esac
      - name: Record sent
        if: success() && github.event_name == 'schedule'
        run: |
          git add data/ || true
          git diff --cached --quiet && exit 0
          git commit -m "sent: $(date +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briefing-${{ github.run_id }}
          path: output/
          retention-days: 7
      - name: Notify failure
        if: failure()
        run: |
          TAIL="$(tail -n 15 output/run.log 2>/dev/null | cut -c1-300 || echo '로그 없음')"
          # GitHub 오류 표시(Annotations)에 로그 끝부분 남기기 (토큰 등 비밀값은 자동 마스킹)
          echo "::error title=run.log tail::$(echo "$TAIL" | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          RESP=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="⚠️ 미국증시 브리핑 전송 실패
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ${TAIL}")
          echo "::warning title=telegram notify::$(echo "$RESP" | cut -c1-200)"
