name: 1) Collect market data

# 한국시간 월~금 07:10 — yfinance 로 시세·목표가 수집 → data/<날짜>/market.json 커밋
on:
  schedule:
    - cron: "10 22 * * 0-4"     # UTC 일~목 22:10 = KST 월~금 07:10
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python main.py collect
      - name: Commit market.json
        run: |
          git config user.name  "stock-brief-bot"
          git config user.email "stock-brief-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "market: $(date +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
